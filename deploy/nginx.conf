server {
    listen 80;
    server_name www.teo.superlapka.ru;
    return 308 https://teo.superlapka.ru$request_uri;
}

server {
    listen 80;
    server_name teo.superlapka.ru _;
    client_max_body_size 1m;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/audio/narration/([a-z0-9_-]+/chapter-[0-9]+/manifest\.json|catalog\.json)$ {
        alias /srv/narration/$1;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /audio/narration/ {
        alias /srv/narration/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://site:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
