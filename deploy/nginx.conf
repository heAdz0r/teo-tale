map $http_x_forwarded_proto $origin_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $origin_host {
    default $http_x_forwarded_host;
    "" $host;
}

server {
    listen 80;
    server_name www.teo.superlapka.ru;
    return 308 https://teo.superlapka.ru$request_uri;
}

server {
    listen 80 default_server;
    server_name teo.superlapka.ru _;
    client_max_body_size 1m;

    # Resolve Compose service names at request time. This keeps `nginx -t`
    # valid during the image build, before the `site` container exists.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_upstream site:3000;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/audio/narration/([a-z0-9_-]+/chapter-[0-9]+/manifest\.json|catalog\.json)$ {
        alias /srv/narration/$1;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /audio/narration/ {
        alias /srv/narration/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://$site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header X-Forwarded-Host $origin_host;
    }
}
